# 只给 ShardPG 节点（追加在 common.conf 之后）。其余参数用 conf/node.conf.tmpl 的值
# （rc_update_recheck、early_lock_release、分片 vacuum 触发等与 lab 相同）。
# 跨仓 NewOrder / Payment 在每个参与 worker 上各留一个 prepared 事务
max_prepared_transactions = 1000
# 协调者的"客户端"连接 = pgbench 终端 + 各 worker 后端取 TSO 的连接（lab 256 终端时协调者约 450 个，384 终端估计约 670 个）
citus.max_client_connections = 900
# Raft 组上限（启动参数）：8 张表 × SHARD_COUNT 个分片组，单副本时每台 worker 只有自己那 1/3；12 分片 = 每台 32 组
pg_raft.max_groups = 128
