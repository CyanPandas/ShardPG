# ShardPG 各节点与单机 PG 共用的资源 / 持久化参数（4 核 8 GB 机器）。
# deploy_shardpg.sh 把它追加到每个节点的配置末尾（再叠 shardpg.conf，协调者另叠 coord.conf）；
# deploy_native.sh 把它逐行转成单机 PG 的 -c 参数。公平性靠"两边同一份文件"保证 —— 只改这里。
# 格式：一行一个 key = value，不要写行尾注释（转 -c 参数时不处理）。
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_wal_size = 4GB
checkpoint_timeout = 15min
synchronous_commit = on
fsync = on
max_connections = 1000
default_transaction_isolation = 'read committed'
