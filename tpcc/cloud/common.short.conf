# 短窗口实验（每轮测 1 分钟）用的公共参数：与 common.conf 相同，只是 max_wal_size 4GB → 16GB，
# 配合 bench.sh 的 PRE_CHECKPOINT=1（每轮前手动 CHECKPOINT），保证 1 分钟窗口里不会冒出 WAL 触发的检查点。
# 两套系统都用这一份（cloud.env 里 COMMON_CONF=$CLOUD_DIR/common.short.conf）。
# 格式：一行一个 key = value，不要写行尾注释（转 -c 参数时不处理）。
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_wal_size = 16GB
checkpoint_timeout = 15min
synchronous_commit = on
fsync = on
max_connections = 1000
default_transaction_isolation = 'read committed'
