# 只给原版 Citus 节点（追加在 common.conf 之后，协调者再叠 coord.conf），与 lab 的 Citus 对照（citus_node.sh）同一组参数。
shared_preload_libraries = citus
# 跨仓 NewOrder / Payment 走 Citus 2PC，在每个参与 worker 上各留一个 prepared 事务（与 shardpg.conf 相同）
max_prepared_transactions = 1000
citus.max_client_connections = 900
# 函数下推到 worker 后，碰到远程仓库要由 worker 发起嵌套分布式访问（与 ShardPG 节点相同）
citus.allow_nested_distributed_execution = on
log_min_duration_statement = 5000
log_lock_waits = on
