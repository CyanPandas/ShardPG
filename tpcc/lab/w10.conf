# 2026-10-21 10 个 worker 功能验证用的 ShardPG 覆盖段（tpcc-stdw10/conf/w10.conf）：与 std.conf 相同，
# 只把缓冲池压到 1GB —— 每台机器上要跑 10 个实例（3 到 4 个主库 + 6 到 7 个备库），40 仓每个 worker 只有几百 MB 数据
shared_buffers = 1GB
effective_cache_size = 4GB
max_wal_size = 4GB
# 连接：每个 worker 除了协调者来的会话，还有其余 9 个 worker 的后端经 Citus 连进来
max_connections = 1500
max_prepared_transactions = 1500
citus.max_client_connections = 1200
# 分片 vacuum：热点行高频回收；关物理截断（见 shard_vacuum_truncate 说明）
pg_partdist.shard_vacuum_trigger_age = 1000
pg_partdist.shard_vacuum_trigger_interval_s = 5
pg_partdist.shard_vacuum_truncate = off
pg_partdist.rc_update_recheck = on
pg_partdist.early_lock_release = on
