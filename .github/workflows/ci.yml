name: pg_partdist CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: PG ${{ matrix.pg_version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        pg_version: ["16"]
        pg_minor: ["16.14"]

    services:
      postgres:
        image: citusdata/citus:13.1.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg_version }} dev headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            postgresql-${{ matrix.pg_version }} \
            postgresql-server-dev-${{ matrix.pg_version }} \
            build-essential

      - name: Verify pg_config
        run: ${{ env.PG_CONFIG }} --version

      - name: Build extension
        working-directory: pg-partdist-src
        run: make PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Install extension
        working-directory: pg-partdist-src
        run: sudo make install PG_CONFIG=${{ env.PG_CONFIG }}

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p $PGPORT -U $PGUSER; do
            sleep 1
          done

      - name: Load Citus extension on coordinator
        run: |
          psql -h localhost -U $PGUSER -c "CREATE EXTENSION IF NOT EXISTS citus;"

      - name: Run regression tests
        working-directory: pg-partdist-src
        run: |
          make installcheck \
            PG_CONFIG=${{ env.PG_CONFIG }} \
            PGUSER=$PGUSER \
            PGPORT=$PGPORT \
            PGHOST=localhost

      - name: Upload test diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-pg${{ matrix.pg_version }}
          path: pg-partdist-src/test/regression.diffs
